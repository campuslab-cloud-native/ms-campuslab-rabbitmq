services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: campuslab-rabbitmq
    hostname: campuslab-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - campuslab-mq-network

  rabbit-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campuslab-rabbit-admin
    restart: unless-stopped
    environment:
      SERVER_PORT: 8087
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8087:8087"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8087/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - campuslab-mq-network

volumes:
  rabbitmq-data:

networks:
  campuslab-mq-network:
    name: campuslab-mq-network
    driver: bridge
