# Formacion automatica del cluster local (2 nodos).
# Con classic_config, el nodo que arranca con datos vacios se une a los nodos
# listados; rabbitmq-1 es el primero de la lista y arranca como nodo inicial.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
